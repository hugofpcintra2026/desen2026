<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var slug = '/9345488724234';

      // Se alguém ainda acessar com a slug antiga, remove a slug e manda para a rota limpa
      if (path.indexOf(slug) === 0) {
        var clean = path.substring(slug.length) || '/';
        window.location.replace(clean + search + hash);
        return;
      }

      window.location.replace('/' + search + hash);
    })();
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #475569;">
    Carregando... Por favor, aguarde.
  </p>
</body>
</html>
