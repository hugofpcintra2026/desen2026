[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/xpay-proxy/*"
  to = "https://api.xpaybrasil.com/v1/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-API-KEY = "cpk_live_ex84lopcp2xexagmazz6za11"

[[redirects]]
  from = "/api/pix"
  to = "/.netlify/functions/pix"
  status = 200

[[redirects]]
  from = "/api/status/*"
  to = "/.netlify/functions/status?id=:splat"
  status = 200

[[redirects]]
  from = "/api/check_status"
  to = "/.netlify/functions/check_status"
  status = 200

[[redirects]]
  from = "/api/upload-comprovante"
  to = "/.netlify/functions/upload-comprovante"
  status = 200

[[headers]]
  for = "/73653734543345/sobre"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/73653734543345/contato"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
